# ============================================================
# CẤU HÌNH HỆ THỐNG & MÀU SẮC (TỐI ƯU CHO EVERFOREST)
# ============================================================
# Hỗ trợ True Color (Rất quan trọng cho Neovim)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Tc"

# Đổi phím Prefix sang Ctrl-a
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Giảm độ trễ phím Esc xuống 0 (Cực kỳ quan trọng khi dùng Vim)
set -sg escape-time 0

# Mouse support
set -g mouse on

# ============================================================
# QUẢN LÝ CỬA SỔ & PANE (SỬ DỤNG PHÍM VIM)
# ============================================================
# Tách cửa sổ giữ nguyên đường dẫn hiện tại
unbind %
bind '\' split-window -h -c '#{pane_current_path}'
unbind '"'
bind - split-window -v -c '#{pane_current_path}'

# Reload config nhanh
unbind r 
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Resize Pane kiểu Vim
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r h resize-pane -L 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z

# Chế độ Copy kiểu Vim
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# Window index bắt đầu từ 1
set-option -g base-index 1
set-option -g renumber-windows on

# ============================================================
# PLUGINS (TPM)
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-ram-usage'

# ============================================================
# GIAO DIỆN (THEME CATPPUCCIN & TRANSPARENCY)
# ============================================================
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "basic"

# Trong suốt thanh status (Phù hợp WezTerm)
set -g status-bg default
set -g status-style bg=default

set -g window-status-separator ""
set -g @catppuccin_window_current_text_color "#{@thm_surface_1}"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"
set -g @catppuccin_window_current_text " #[bg=#{@thm_mantle}] #{b:pane_current_path}"

set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_number_color "#{@thm_lavender}"

# Thanh trạng thái bên trái (Session name)
set -g status-left "#[bg=#{@thm_green},fg=#{@thm_crust}]#[reverse]█#[noreverse]#S "

# Thanh trạng thái bên phải (CPU, Mem, Clock)
set -g status-right-length 100
set -g status-right ""
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#[bg=#{@thm_mauve},fg=#{@thm_crust}]#[reverse]█#[noreverse]󰍛 "
set -ag status-right "#[fg=#{@thm_fg},bg=#{@thm_mantle}] #{ram_percentage} "

# set -agF status-right "#[bg=#{@thm_green},fg=#{@thm_crust}]#[reverse]█#[noreverse]󰢗 "
# set -agF status-right "#[fg=#{@thm_fg},bg=#{@thm_mantle}] %m/%d %H:%M "

# Khởi chạy TPM (Dòng này luôn ở cuối cùng)
run '~/.tmux/plugins/tpm/tpm'
